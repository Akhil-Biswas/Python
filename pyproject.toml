[project]
name = "Python-Notes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 80
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "I", # isort (import sorting)
    "UP" # pyupgrade
    ]
ignore = []
